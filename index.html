*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
  --text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;
  --purple:#bc8cff;--cyan:#39d2c0;--orange:#f0883e;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.header{background:var(--surface);padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto}
.header h1{font-size:1.4em;font-weight:700;color:var(--accent)}
.header p{color:var(--muted);margin-top:3px;font-size:0.8em}

.stat-item{text-align:center;padding:5px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)}
.stat-item .num{font-size:1.15em;font-weight:800;color:var(--accent)}
.stat-item .label{font-size:0.6em;color:var(--muted);margin-top:1px}
.controls{max-width:1200px;margin:0 auto;padding:14px 20px 6px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px}
.ptogs{display:flex;flex-wrap:wrap;gap:4px}
.ptog{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:0.74em;font-weight:600;transition:.15s}
.ptog:hover{border-color:var(--muted)}
.ptog.active{color:var(--bg);border-color:transparent}
.ptog.all.active{background:var(--accent)}
.ptog.stc.active{background:var(--purple)}
.ptog.mobily.active{background:var(--green)}
.ptog.zain.active{background:var(--red)}
.ptog.salam.active{background:var(--cyan)}
.ptog.go.active{background:var(--orange)}
.sgrp{display:flex;flex-direction:column;gap:2px;min-width:160px}
.sgrp label{font-size:0.65em;color:var(--muted);font-weight:600}
.sgrp .rv{font-size:0.76em;color:var(--accent);font-weight:700}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--surface2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.sbtns{display:flex;gap:3px;flex-wrap:wrap}
.sb{padding:4px 9px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:0.7em;font-weight:600;transition:.15s}
.sb.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.sb:hover{color:var(--text)}
.sbx{flex:1;min-width:160px}
.sbx input{width:100%;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.8em;outline:none}
.sbx input:focus{border-color:var(--accent)}
.rc{font-size:0.7em;color:var(--muted);padding:2px 0;margin-right:auto}
.table-wrap{max-width:1200px;margin:0 auto;padding:0 20px 20px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 1px;min-width:700px}
thead th{padding:6px 8px;text-align:right;font-size:0.62em;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th.sorted{color:var(--accent)}
thead th .ar{display:inline-block;margin-right:2px;font-size:0.8em;opacity:0.2}
thead th.sorted .ar{opacity:1}
tbody tr:hover{background:rgba(88,166,255,0.04)}
tbody td{padding:8px;font-size:0.82em;border-bottom:1px solid rgba(48,54,61,0.4);vertical-align:middle}
.rk{width:24px;text-align:center;font-weight:800;font-size:0.72em;color:var(--muted);opacity:0.4}
.rk.g1{color:var(--yellow);opacity:1}
.rk.g2{color:var(--muted);opacity:0.8}
.rk.g3{color:var(--orange);opacity:0.7}
.pc{font-weight:700;font-size:0.86em;white-space:nowrap}
.pc.stc{color:var(--purple)}.pc.mobily{color:var(--green)}.pc.zain{color:var(--red)}.pc.salam{color:var(--cyan)}.pc.go{color:var(--orange)}
.spd{white-space:nowrap;font-weight:700;font-size:0.9em}
.spd .dn{color:var(--green)}
.spd .up{color:var(--muted);font-size:0.88em;opacity:0.7}
.prc{text-align:left;white-space:nowrap}
.prc .mn{font-weight:800;color:var(--green);font-size:0.92em}
.prc .pp{display:inline-block;background:rgba(240,136,62,0.12);color:var(--orange);padding:1px 5px;border-radius:3px;font-size:0.95em;font-weight:700}
.prc .pm{font-size:0.66em;color:var(--green);font-weight:600;margin-top:1px}
.prc .pl{font-size:0.64em;color:var(--muted);margin-top:1px}
.prc .eff{font-size:0.64em;color:var(--muted);margin-top:1px}
.prc .eff .yp{color:var(--yellow);font-weight:600}
.ttl{text-align:left;white-space:nowrap;opacity:0.5}
tr:hover .ttl{opacity:0.9}
.ttl .tp{font-weight:700;color:var(--yellow);font-size:0.82em}
.nt{font-size:0.68em;color:var(--muted);max-width:160px;opacity:0.45}
tr:hover .nt{opacity:0.75}
.la{color:var(--accent);text-decoration:none;font-size:0.7em;padding:3px 7px;border:1px solid var(--accent);border-radius:4px;transition:.15s;white-space:nowrap;display:inline-block;opacity:0.55}
.la:hover{opacity:1;background:var(--accent);color:var(--bg)}

.empty{text-align:center;padding:40px;color:var(--muted);opacity:0.4}
.fab{position:fixed;bottom:14px;left:14px;z-index:100}
.fab button{padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:0.72em;font-weight:600;transition:.15s}
.fab button:hover{color:var(--text);background:var(--surface2)}
.ov{display:none;position:fixed;inset:0;background:rgba(13,17,23,0.7);backdrop-filter:blur(3px);z-index:200;justify-content:center;align-items:center}
.ov.open{display:flex}
.md{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:480px;width:92%;max-height:80vh;overflow-y:auto}
.md h2{font-size:1em;margin-bottom:10px}

.md .x:hover{opacity:1;color:var(--text)}

.ld{font-size:0.65em;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.ld .dot{width:5px;height:5px;border-radius:50%;display:inline-block}

<tbody id="tb"></tbody>
</table>

</div>

function filt(){return P.filter(o=>{

  if(o.pr>S.pmax)return false;
  if(o.d<S.dmin)return false;

  if(S.sr){const q=S.sr.toLowerCase();if(!o.n.toLowerCase().includes(q)&&!o.p.toLowerCase().includes(q))return false}

});}
function srt(a){a.sort((x,y)=>{
  let vx,vy;
  switch(S.sk){case'eff':vx=x._e;vy=y._e;break;case'price':vx=x.pr;vy=y.pr;break;case'total':vx=x._t;vy=y._t;break;case'down':vx=x.d;vy=y.d;break;case'up':vx=x.u;vy=y.u;break;case'prov':vx=x.p;vy=y.p;break;case'promo':vx=x.pro?1:0;vy=y.pro?1:0;break;case'name':vx=x.n;vy=y.n;break;default:vx=x._e;vy=y._e;}
  if(typeof vx==='string')return S.sd==='asc'?vx.localeCompare(vy):vy.localeCompare(vx);
  return S.sd==='asc'?vx-vy:vy-vx;
});return a;}

function fp(v){return v.toFixed(v%1===0?0:2)}
function fs(v){return v>=1000?(v/1000).toFixed(0)+'G':v+'M'}

function render(){
  const data=srt(filt());
  const tb=document.getElementById('tb');
  document.getElementById('emp').style.display=data.length?'none':'block';
  document.getElementById('rc').textContent=data.length+' من '+P.length+' باقة';
  tb.innerHTML=data.map((o,i)=>{
    const rk=i===0?'g1':i===1?'g2':i===2?'g3':'';
    const hp=o.po!=null;
    let priceHtml;
    if(hp){
      priceHtml=`<div class="pp">${fp(o.pr)}</div>
        <div class="pm">${fp(o.po)} ريال x ${o.pm} شهور</div>
        <div class="pl">ثم ${fp(o.na)} ريال/شهر</div>`;
    }else{
      priceHtml=`<div class="mn">${fp(o.pr)}</div>`;
    }
    const promoHtml=o.pro?`<span class="pp">${o.pro}</span>`:'';
    return `<tr>
      <td class="rk ${rk}">${i+1}</td>
      <td><span class="pc ${o.p.toLowerCase()}">${o.p}</span></td>
      <td style="font-size:0.8em">${o.n}</td>
      <td class="spd"><span class="dn">${fs(o.d)}</span>/<span class="up">${fs(o.u)}</span></td>
      <td class="prc">${priceHtml}</td>
      <td class="prc"><div class="mn">${fp(o._e)}</div>${hp?`<div class="eff">فعلي <span class="yp">${fp(o._e)}</span>/شهر</div>`:''}</td>
      <td class="ttl"><span class="tp">${fp(o._t)}</span></td>
      <td class="nt">${promoHtml}</td>
      <td><a class="la" href="${o.l}" target="_blank">&#x2197;</a></td>
    </tr>`;
  }).join('');
  updSort();
}
function updSort(){
  document.querySelectorAll('thead th').forEach(t=>{t.classList.remove('sorted');t.querySelector('.ar').textContent='\u21C5';t.querySelector('.ar').style.opacity='0.2'});
  const th=document.querySelector(`thead th[data-k="${S.sk}"]`);
  if(th){th.classList.add('sorted');th.querySelector('.ar').textContent=S.sd==='asc'?'\u2191':'\u2193';th.querySelector('.ar').style.opacity='1'}
}

document.querySelectorAll('.ptog').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ptog').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.pv=b.dataset.p;save();render();
}));
document.getElementById('srch').value=S.sr;
document.getElementById('srch').addEventListener('input',e=>{S.sr=e.target.value;save();render()});
document.getElementById('pmax').value=S.pmax;
document.getElementById('pmax').addEventListener('input',e=>{S.pmax=+e.target.value;document.getElementById('pv').textContent=S.pmax;save();render()});
document.getElementById('dmin').value=S.dmin;
document.getElementById('dmin').addEventListener('input',e=>{S.dmin=+e.target.value;document.getElementById('dv').textContent=S.dmin;save();render()});
document.getElementById('umin').value=S.umin;
document.getElementById('umin').addEventListener('input',e=>{S.umin=+e.target.value;document.getElementById('uv').textContent=S.umin;save();render()});
document.querySelectorAll('.sb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.sk=b.dataset.k;S.sd=b.dataset.d;save();render();
}));
document.querySelectorAll('thead th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;
  if(S.sk===k){S.sd=S.sd==='asc'?'desc':'asc'}else{S.sk=k;S.sd='asc'}
  document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('active',b.dataset.k===k&&b.dataset.d===S.sd));
  save();render();
}));

function openLog(){
  document.getElementById('lentries').innerHTML=LOG.map(l=>{
    const dc=l.s==='err'?'err':l.s==='chg'?'chg':'ok';
    return `<div class="le"><div class="ld"><span class="dot ${dc}"></span>${l.d}</div><div class="lb">${l.e.map(x=>'&bull; '+x).join('<br>')}</div></div>`;
  }).join('');
  document.getElementById('lov').classList.add('open');
}
function closeLog(e){
  if(!e||e.target===document.getElementById('lov')||e.target.classList.contains('x'))document.getElementById('lov').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLog()});

(()=>{
  document.querySelectorAll('.ptog').forEach(b=>b.classList.toggle('active',b.dataset.p===S.pv));
  document.getElementById('srch').value=S.sr;
  document.getElementById('pmax').value=S.pmax;document.getElementById('pv').textContent=S.pmax;
  document.getElementById('dmin').value=S.dmin;document.getElementById('dv').textContent=S.dmin;
  document.getElementById('umin').value=S.umin;document.getElementById('uv').textContent=S.umin;
  document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('active',b.dataset.k===S.sk&&b.dataset.d===S.sd));
  document.getElementById('badge').textContent=new Date().toLocaleDateString('ar-SA',{timeZone:'Asia/Riyadh',year:'numeric',month:'short',day:'numeric'});
  render();
})();
</script>
</body>
</html>
