<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقارنة اسعار الفايبر السعودية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232E3440'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='%2388C0D0'>S</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#2E3440;--surface:#3B4252;--surface2:#434C5E;--border:#4C566A;
  --text:#ECEFF4;--muted:#D8DEE9;--accent:#88C0D0;--green:#A3BE8C;--yellow:#EBCB8B;--red:#BF616A;
  --purple:#B48EAD;--cyan:#8FBCBB;--orange:#D08770;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}

.header{background:linear-gradient(160deg,#2E3440 0%,#374050 50%,#2E3440 100%);padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto}
.header h1{font-size:1.5em;font-weight:800;color:var(--accent)}
.header p{color:var(--muted);margin-top:4px;font-size:0.82em;opacity:0.8}
.badge-live{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.68em;font-weight:600;margin-top:8px;background:rgba(163,190,140,0.15);color:var(--green);border:1px solid rgba(163,190,140,0.3)}
.badge-live::before{content:'● ';animation:pulse 2s infinite;font-size:0.8em}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.stat-item{text-align:center;padding:6px 14px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.stat-item .num{font-size:1.2em;font-weight:800;color:var(--accent)}
.stat-item .label{font-size:0.62em;color:var(--muted);margin-top:1px;opacity:0.7}

.controls{max-width:1200px;margin:0 auto;padding:16px 20px 8px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}

.ptogs{display:flex;flex-wrap:wrap;gap:5px}
.ptog{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:0.76em;font-weight:600;transition:.15s}
.ptog:hover{border-color:var(--muted)}
.ptog.active{color:var(--bg);border-color:transparent}
.ptog.all.active{background:var(--accent);color:var(--bg)}
.ptog.stc.active{background:var(--purple)}
.ptog.mobily.active{background:var(--green);color:var(--bg)}
.ptog.zain.active{background:var(--red)}
.ptog.salam.active{background:var(--cyan);color:var(--bg)}
.ptog.go.active{background:var(--orange)}

.sgrp{display:flex;flex-direction:column;gap:3px;min-width:170px}
.sgrp label{font-size:0.68em;color:var(--muted);font-weight:600;opacity:0.8}
.sgrp .rv{font-size:0.78em;color:var(--accent);font-weight:700}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--surface2);outline:none;border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}

.sbtns{display:flex;gap:4px;flex-wrap:wrap}
.sb{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:0.72em;font-weight:600;transition:.15s}
.sb.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.sb:hover{color:var(--text)}

.sbx{flex:1;min-width:180px}
.sbx input{width:100%;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.82em;outline:none;transition:border .15s}
.sbx input:focus{border-color:var(--accent)}

.rc{font-size:0.74em;color:var(--muted);padding:2px 0;margin-right:auto;opacity:0.7}

.table-wrap{max-width:1200px;margin:0 auto;padding:0 20px 24px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 2px;min-width:750px}
thead th{padding:8px 10px;text-align:right;font-size:0.66em;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;opacity:0.7}
thead th:hover{opacity:1}
thead th.sorted{color:var(--accent);opacity:1}
thead th .ar{display:inline-block;margin-right:3px;font-size:0.75em;opacity:0.25;transition:opacity .15s}
thead th.sorted .ar{opacity:1}

tbody tr{transition:background .1s}
tbody tr:hover{background:rgba(236,239,244,0.04)}
tbody td{padding:9px 10px;font-size:0.84em;border-bottom:1px solid rgba(76,86,106,0.3);vertical-align:middle}

.rk{width:28px;text-align:center;font-weight:800;font-size:0.74em;color:var(--muted);opacity:0.5}
.rk.g1{color:var(--yellow);opacity:1}
.rk.g2{color:var(--muted);opacity:0.9}
.rk.g3{color:var(--orange);opacity:0.8}

.pc{font-weight:700;font-size:0.88em;white-space:nowrap}
.pc.stc{color:var(--purple)}.pc.mobily{color:var(--green)}.pc.zain{color:var(--red)}.pc.salam{color:var(--cyan)}.pc.go{color:var(--orange)}

.spd{white-space:nowrap;font-weight:700;font-size:0.92em}
.spd .dn{color:var(--green)}
.spd .up{color:var(--muted);opacity:0.7;font-size:0.9em}

.prc{text-align:left;white-space:nowrap}
.prc .mn{font-weight:800;color:var(--green);font-size:0.95em}
.prc .mn .cr{font-size:0.7em;color:var(--muted);margin-right:2px;opacity:0.7}
.prc .pp{display:inline-block;background:rgba(208,135,112,0.15);color:var(--orange);padding:2px 6px;border-radius:4px;font-size:1em;font-weight:700}
.prc .pm{font-size:0.68em;color:var(--green);font-weight:600;margin-top:2px;opacity:0.9}
.prc .eff{font-size:0.66em;color:var(--muted);margin-top:2px;opacity:0.6}
.prc .eff .yp{color:var(--yellow);font-weight:600}

.ttl{text-align:left;white-space:nowrap;opacity:0.55;transition:opacity .15s}
tr:hover .ttl{opacity:1}
.ttl .tp{font-weight:700;color:var(--yellow);font-size:0.85em}

.nt{font-size:0.7em;color:var(--muted);max-width:170px;opacity:0.5}
tr:hover .nt{opacity:0.8}

.la{color:var(--accent);text-decoration:none;font-size:0.72em;padding:3px 8px;border:1px solid var(--accent);border-radius:5px;transition:.15s;white-space:nowrap;display:inline-block;opacity:0.6}
.la:hover{opacity:1;background:var(--accent);color:var(--bg)}
tr:hover .la{opacity:1}

.empty{text-align:center;padding:50px;color:var(--muted);opacity:0.5}

/* changelog button */
.fab{position:fixed;bottom:16px;left:16px;z-index:100}
.fab button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:0.74em;font-weight:600;transition:.15s;box-shadow:0 2px 12px rgba(0,0,0,0.2)}
.fab button:hover{color:var(--text);border-color:var(--border);background:var(--surface2)}
/* modal */
.ov{display:none;position:fixed;inset:0;background:rgba(46,52,64,0.75);backdrop-filter:blur(3px);z-index:200;justify-content:center;align-items:center}
.ov.open{display:flex}
.md{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:500px;width:92%;max-height:80vh;overflow-y:auto}
.md h2{font-size:1.05em;margin-bottom:12px;color:var(--text)}
.md .x{float:left;background:none;border:none;color:var(--muted);font-size:1.2em;cursor:pointer;opacity:0.6}
.md .x:hover{opacity:1;color:var(--text)}
.le{padding:10px 0;border-bottom:1px solid var(--border)}
.le:last-child{border-bottom:none}
.ld{font-size:0.68em;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:5px;opacity:0.7}
.ld .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ld .dot.err{background:var(--red)}.ld .dot.chg{background:var(--green)}.ld .dot.ok{background:var(--surface2)}
.lb{font-size:0.8em;line-height:1.6;color:var(--text);opacity:0.8}

@media(max-width:650px){
  .header h1{font-size:1.15em}
  .ctrl-row{gap:6px}
  .sgrp{min-width:120px}
  .stat-item{padding:4px 10px}
  .table-wrap{padding:0 8px 16px}
}
</style>
</head>
<body>

<div class="header"><div class="header-inner">
  <h1>SA - مقارنة اسعار الفايبر</h1>
  <p>جميع الباقات الرسمية — مرتبة حسب السعر الفعلي للعقد</p>
  <span class="badge-live" id="badge">تحديث مباشر</span>
</div></div>

<div class="stats">
  <div class="stat-item"><div class="num" id="s-count">29</div><div class="label">باقة</div></div>
  <div class="stat-item"><div class="num">5</div><div class="label">مزود</div></div>
  <div class="stat-item"><div class="num" id="s-low">189</div><div class="label">ارخص/شهر</div></div>
  <div class="stat-item"><div class="num">3</div><div class="label">عرض ترويجي</div></div>
</div>

<div class="controls">
  <div class="ctrl-row">
    <div class="ptogs">
      <button class="ptog all active" data-p="all">الكل</button>
      <button class="ptog stc" data-p="STC">STC</button>
      <button class="ptog mobily" data-p="Mobily">Mobily</button>
      <button class="ptog zain" data-p="Zain">Zain</button>
      <button class="ptog salam" data-p="Salam">Salam</button>
      <button class="ptog go" data-p="Go">Go</button>
    </div>
    <div class="sbx"><input type="text" id="srch" placeholder="بحث..."></div>
  </div>
  <div class="ctrl-row">
    <div class="sgrp"><label>السعر حتى: <span class="rv" id="pv">1000</span> ريال</label><input type="range" id="pmax" min="0" max="1000" value="1000" step="10"></div>
    <div class="sgrp"><label>التحميل من: <span class="rv" id="dv">0</span> ميجا</label><input type="range" id="dmin" min="0" max="1000" value="0" step="25"></div>
    <div class="sgrp"><label>الرفع من: <span class="rv" id="uv">0</span> ميجا</label><input type="range" id="umin" min="0" max="300" value="0" step="25"></div>
  </div>
  <div class="ctrl-row">
    <div class="sbtns">
      <button class="sb active" data-k="eff" data-d="asc">الفعلي ↑</button>
      <button class="sb" data-k="eff" data-d="desc">الفعلي ↓</button>
      <button class="sb" data-k="price" data-d="asc">الشهري ↑</button>
      <button class="sb" data-k="down" data-d="desc">التحميل ↓</button>
      <button class="sb" data-k="up" data-d="desc">الرفع ↓</button>
      <button class="sb" data-k="total" data-d="asc">المجموع ↑</button>
    </div>
    <div class="rc" id="rc"></div>
  </div>
</div>

<div class="table-wrap">
<table>
<thead><tr>
  <th style="width:28px">#</th>
  <th data-k="prov">المزود <span class="ar">&#x21C5;</span></th>
  <th data-k="name">الباقة <span class="ar">&#x21C5;</span></th>
  <th data-k="down" class="sorted">السرعة &#x2193; <span class="ar">&#x2193;</span></th>
  <th data-k="price">شهرياً <span class="ar">&#x21C5;</span></th>
  <th data-k="eff" class="sorted">الفعلي/شهر <span class="ar">&#x2191;</span></th>
  <th data-k="total">مجموع ١٢ شهر <span class="ar">&#x21C5;</span></th>
  <th></th>
  <th style="width:55px"></th>
</tr></thead>
<tbody id="tb"></tbody>
</table>
<div class="empty" id="emp" style="display:none"><p>لا توجد نتائج</p></div>
</div>

<div class="fab"><button onclick="openLog()">&#x270E; سجل التحديثات</button></div>
<div class="ov" id="lov" onclick="closeLog(event)">
  <div class="md" onclick="event.stopPropagation()">
    <button class="x" onclick="closeLog()">&#x2715;</button>
    <h2>&#x270E; سجل التحديثات</h2>
    <div id="lentries"></div>
  </div>
</div>

<script>
const P=[
  {p:"Go",n:"فايبر 100",d:100,u:25,pr:189,po:null,pm:null,na:null,x:""},
  {p:"Go",n:"فايبر 200",d:200,u:50,pr:239,po:null,pm:null,na:null,x:""},
  {p:"Go",n:"فايبر 300",d:300,u:75,pr:230,po:null,pm:null,na:null,x:"عرض ترويجي - عقد ١٢ شهر"},
  {p:"Go",n:"فايبر 500",d:500,u:125,pr:389,po:null,pm:null,na:null,x:""},
  {p:"Zain",n:"Fiber Home Basic",d:100,u:25,pr:199,po:null,pm:null,na:null,x:"+١١٥ رسوم تأسيس"},
  {p:"Zain",n:"Fiber Home",d:200,u:50,pr:239,po:null,pm:null,na:null,x:""},
  {p:"Zain",n:"Fiber Home Plus",d:300,u:100,pr:289,po:null,pm:null,na:null,x:"اونلاين اونلي"},
  {p:"Zain",n:"Fiber Home Gaming",d:300,u:100,pr:299,po:null,pm:null,na:null,x:"اونلاين + قسيمة ٥٠ شهرياً"},
  {p:"Zain",n:"Fiber Home Premium",d:500,u:200,pr:399,po:null,pm:null,na:null,x:""},
  {p:"Zain",n:"Fiber Home Black",d:1000,u:300,pr:999,po:null,pm:null,na:null,x:"اونلاين + ٤ اشتراكات"},
  {p:"Mobily",n:"Fiber 200",d:200,u:50,pr:230,po:null,pm:null,na:null,x:""},
  {p:"Mobily",n:"Fiber 300",d:300,u:100,pr:287.5,po:null,pm:null,na:null,x:""},
  {p:"Mobily",n:"Fiber 400",d:400,u:150,pr:345,po:null,pm:null,na:null,x:""},
  {p:"Mobily",n:"Fiber 500",d:500,u:200,pr:402.5,po:null,pm:null,na:null,x:""},
  {p:"Mobily",n:"Gamers 500",d:500,u:200,pr:402.5,po:null,pm:null,na:null,x:"+ خصم ٦٩٠ اجهزة"},
  {p:"Mobily",n:"FTTR 400",d:400,u:150,pr:402.5,po:null,pm:null,na:null,x:"FTTR شبكة داخلية"},
  {p:"Mobily",n:"FTTR 500",d:500,u:200,pr:460,po:null,pm:null,na:null,x:"FTTR شبكة داخلية"},
  {p:"Mobily",n:"Fiber 1G",d:1000,u:300,pr:920,po:null,pm:null,na:null,x:""},
  {p:"Mobily",n:"FTTR 1G",d:1000,u:300,pr:920,po:null,pm:null,na:null,x:"FTTR شبكة داخلية"},
  {p:"STC",n:"بيتي فايبر بيسك",d:300,u:100,pr:287.5,po:null,pm:null,na:null,x:""},
  {p:"STC",n:"ستريم لايت 500",d:500,u:125,pr:345,po:null,pm:null,na:null,x:""},
  {p:"STC",n:"ستريم 500",d:500,u:125,pr:402.5,po:null,pm:null,na:null,x:"+ stc tv اشتراك"},
  {p:"STC",n:"بيسك برو 300",d:300,u:100,pr:460,po:null,pm:null,na:null,x:"+ stc tv"},
  {p:"STC",n:"انترتينمنت 500",d:500,u:200,pr:460,po:null,pm:null,na:null,x:"+ stc tv + اشتراكين"},
  {p:"STC",n:"ستريم برو 500",d:500,u:125,pr:575,po:null,pm:null,na:null,x:"+ stc tv + اشتراك"},
  {p:"STC",n:"انترتينمنت برو 500",d:500,u:200,pr:690,po:null,pm:null,na:null,x:"+ stc tv + اشتراكين"},
  {p:"STC",n:"ماكس 1G",d:1000,u:300,pr:920,po:null,pm:null,na:null,x:"+ stc tv + ٤ اشتراكات"},
  {p:"Salam",n:"فايبر 300",d:300,u:100,pr:290,po:174,pm:3,na:290,x:"خصم ٤٠٪ اول ٣ شهور"},
  {p:"Salam",n:"فايبر 500",d:500,u:125,pr:360,po:216,pm:3,na:360,x:"خصم ٤٠٪ اول ٣ شهور"},
  {p:"Salam",n:"فايبر 1000",d:1000,u:300,pr:1000,po:300,pm:2,na:1000,x:"خصم ٧٠٪ اول شهرين"},
];
P.forEach(o=>{o._e=(o.po&&o.pm&&o.na!=null)?(o.po*o.pm+o.na*(12-o.pm))/12:o.pr;o._t=o._e*12});

const LOG=[
  {d:"٣٠ مايو ٢٠٢٦",s:"err",e:["فشل الفحص - خطا API"]},
  {d:"٢٩ مايو ٢٠٢٦",s:"ok",e:["لا تغيير في الاسعار"]},
  {d:"٢٨ مايو ٢٠٢٦",s:"ok",e:["لا تغيير - ارخص ٥٠٠ ميجا: STC ٣٤٥ ريال"]},
  {d:"٢٧ مايو ٢٠٢٦",s:"chg",e:["اول فحص - خط اساس"]},
];

const S=JSON.parse(localStorage.getItem('sfp')||'null')||{pv:'all',sr:'',pmax:1000,dmin:0,umin:0,sk:'eff',sd:'asc'};
function save(){localStorage.setItem('sfp',JSON.stringify(S))}

function filt(){
  return P.filter(o=>{
    if(S.pv!='all'&&o.p!==S.pv)return false;
    if(o.pr>S.pmax)return false;
    if(o.d<S.dmin)return false;
    if(o.u<S.umin)return false;
    if(S.sr){const q=S.sr.toLowerCase();if(!o.n.toLowerCase().includes(q)&&!o.p.toLowerCase().includes(q))return false}
    return true;
  });
}
function srt(a){
  a.sort((x,y)=>{
    let vx,vy;
    switch(S.sk){
      case'eff':vx=x._e;vy=y._e;break;
      case'price':vx=x.pr;vy=y.pr;break;
      case'total':vx=x._t;vy=y._t;break;
      case'down':vx=x.d;vy=y.d;break;
      case'up':vx=x.u;vy=y.u;break;
      case'prov':vx=x.p;vy=y.p;break;
      case'name':vx=x.n;vy=y.n;break;
      default:vx=x._e;vy=y._e;
    }
    if(typeof vx==='string')return S.sd==='asc'?vx.localeCompare(vy):vy.localeCompare(vx);
    return S.sd==='asc'?vx-vy:vy-vx;
  });
  return a;
}

function fp(v){return v.toFixed(v%1===0?0:2)}
function fs(v){return v>=1000?(v/1000).toFixed(0)+'G':v+'M'}

function render(){
  const data=srt(filt());
  const tb=document.getElementById('tb');
  document.getElementById('emp').style.display=data.length?'none':'block';
  document.getElementById('rc').textContent=data.length+' من '+P.length+' باقة';
  tb.innerHTML=data.map((o,i)=>{
    const rk=i===0?'g1':i===1?'g2':i===2?'g3':'';
    const hp=o.po!=null;
    let ph;
    if(hp){
      ph=`<div class="pp">${fp(o.pr)}</div>
        <div class="pm">${fp(o.po)} ل/${o.pm} شهور</div>
        <div class="pm" style="opacity:0.6">ثم ${fp(o.na)}/شهر</div>`;
    }else{
      ph=`<div class="mn"><span class="cur">﷼</span>${fp(o.pr)}</div>`;
    }
    return `<tr>
      <td class="rk ${rk}">${i+1}</td>
      <td><span class="pc ${o.p.toLowerCase()}">${o.p}</span></td>
      <td style="font-size:0.82em">${o.n}</td>
      <td class="spd"><span class="dn">${fs(o.d)}</span>/<span class="up">${fs(o.u)}</span></td>
      <td class="prc">${ph}</td>
      <td class="prc"><div class="mn"><span class="cur">﷼</span>${fp(o._e)}</div>${hp?`<div class="eff">فعلي <span class="yp">﷼${fp(o._e)}</span>/شهر</div>`:''}</td>
      <td class="ttl"><div class="tp">﷼${fp(o._t)}</div></td>
      <td class="nt">${hp?`<span class="pp">${o.x}</span>`:o.x||'—'}</td>
      <td><a class="la" href="#" onclick="return false" title="${o.p} ${o.n}">رابط</a></td>
    </tr>`;
  }).join('');
  updSort();
}
function updSort(){
  document.querySelectorAll('thead th').forEach(t=>{t.classList.remove('sorted');t.querySelector('.ar').textContent='\u21C5';t.querySelector('.ar').style.opacity='0.25'});
  const th=document.querySelector(`thead th[data-k="${S.sk}"]`);
  if(th){th.classList.add('sorted');th.querySelector('.ar').textContent=S.sd==='asc'?'\u2191':'\u2193';th.querySelector('.ar').style.opacity='1'}
}

document.querySelectorAll('.ptog').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ptog').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.pv=b.dataset.p;save();render();
}));
document.getElementById('srch').value=S.sr;
document.getElementById('srch').addEventListener('input',e=>{S.sr=e.target.value;save();render()});
document.getElementById('pmax').value=S.pmax;
document.getElementById('pmax').addEventListener('input',e=>{S.pmax=+e.target.value;document.getElementById('pv').textContent=S.pmax;save();render()});
document.getElementById('dmin').value=S.dmin;
document.getElementById('dmin').addEventListener('input',e=>{S.dmin=+e.target.value;document.getElementById('dv').textContent=S.dmin;save();render()});
document.getElementById('umin').value=S.umin;
document.getElementById('umin').addEventListener('input',e=>{S.umin=+e.target.value;document.getElementById('uv').textContent=S.umin;save();render()});
document.querySelectorAll('.sb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sb').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.sk=b.dataset.k;S.sd=b.dataset.d;save();render();
}));
document.querySelectorAll('thead th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;
  if(S.sk===k){S.sd=S.sd==='asc'?'desc':'asc'}else{S.sk=k;S.sd='asc'}
  document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('active',b.dataset.k===k&&b.dataset.d===S.sd));
  save();render();
}));

function openLog(){
  document.getElementById('lentries').innerHTML=LOG.map(l=>{
    const dc=l.s==='err'?'err':l.s==='chg'?'chg':'ok';
    return `<div class="le"><div class="ld"><span class="dot ${dc}"></span>${l.d}</div><div class="lb">${l.e.map(x=>'&#x2022; '+x).join('<br>')}</div></div>`;
  }).join('');
  document.getElementById('lov').classList.add('open');
}
function closeLog(e){
  if(!e||e.target===document.getElementById('lov')||e.target.classList.contains('x'))document.getElementById('lov').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLog()});

(()=>{
  document.querySelectorAll('.ptog').forEach(b=>b.classList.toggle('active',b.dataset.p===S.pv));
  document.getElementById('srch').value=S.sr;
  document.getElementById('pmax').value=S.pmax;document.getElementById('pv').textContent=S.pmax;
  document.getElementById('dmin').value=S.dmin;document.getElementById('dv').textContent=S.dmin;
  document.getElementById('umin').value=S.umin;document.getElementById('uv').textContent=S.umin;
  document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('active',b.dataset.k===S.sk&&b.dataset.d===S.sd));
  const dt=new Date().toLocaleString('ar-SA',{timeZone:'Asia/Riyadh',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('badge').textContent='اخر تحديث: '+dt;
  render();
})();
</script>
</body>
</html>
